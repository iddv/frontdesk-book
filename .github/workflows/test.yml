# ci: install the project as the README says and run every test suite on push and pull request.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install: FrontDesk Book uses only the Python standard library, so there are no dependencies to install.
      - name: Run the tests
        run: python3 frontdesk.py test
